services:
  frontend:
    container_name: online_library_prod_frontend
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    container_name: online_library_prod_backend
    build:
      context: .
      dockerfile: src/backend/Dockerfile.prod
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: online_library_prod_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis_data:
