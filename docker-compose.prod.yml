services:
  frontend:
    container_name: online_library_prod_frontend
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    container_name: online_library_prod_backend
    build:
      context: .
      dockerfile: src/backend/Dockerfile.prod
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: online_library_prod_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1"]
    restart: unless-stopped

volumes:
  redis_data:
