services:
  frontend:
    container_name: online_library_dev_frontend
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host

  backend:
    container_name: online_library_dev_backend
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile.dev
    volumes:
      - ./src/backend:/app/src/backend
      - uv-venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run fastapi dev src/backend/main.py --host 0.0.0.0 --port 8000
      "

  redis:
    image: redis:latest
    container_name: online_library_dev_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  uv-venv:
  redis_data:
