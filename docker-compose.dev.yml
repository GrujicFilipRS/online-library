services:
  frontend:
    container_name: online_library_dev_client
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host